# 容器内 Nginx 配置（Docker Compose / 自建镜像部署）
# 裸机部署请使用 deploy/nginx/railway.conf，两者 root 与后端地址不同，勿混用。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # Docker 内置 DNS；配合变量形式的 proxy_pass 在请求期解析，
    # 避免 backend 容器尚未就绪时 Nginx 启动报 host not found。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_service backend;
        # 变量形式的 proxy_pass 若带固定 URI，会把整个请求路径替换成该 URI，
        # 导致 /api/station/list 变成 /api/。用 $request_uri 保留完整路径与查询串。
        proxy_pass http://$backend_service:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /actuator/health {
        set $backend_service backend;
        proxy_pass http://$backend_service:8080$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
