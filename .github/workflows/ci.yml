name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 确认 Docker 可用（Testcontainers Redis 集成测试）
        run: docker info
      - name: Maven 构建并运行测试
        run: sh ./mvnw -B verify

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 代码规范检查（ESLint）
        working-directory: frontend
        run: npm run lint
      - name: 格式检查（Prettier）
        working-directory: frontend
        run: npm run format:check
      - name: 单元测试（Vitest）
        working-directory: frontend
        run: npm run test
      - name: 生产构建
        working-directory: frontend
        run: npm run build
      - name: 安装 E2E 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 端到端测试（Playwright，基于构建产物 preview）
        working-directory: frontend
        run: npm run test:e2e

  compose:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
