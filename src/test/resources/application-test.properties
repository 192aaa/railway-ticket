# 测试环境：使用 H2 内存库，避免依赖本机 MySQL
spring.datasource.url=jdbc:h2:mem:railway_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.cache.type=none
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# 跳过数据初始化，保证测试上下文轻量且不受演示数据影响
app.data-init.enabled=false
app.demo-data.enabled=false

jwt.secret=test_only_secret_key_for_jwt_signing_at_least_32_bytes
jwt.expiration=3600000
