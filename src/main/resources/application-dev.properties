# ==========================================
# 开发环境 (dev) - 本地 MySQL 数据库
# ==========================================
# localhost:3306，用户 railway，库 railway_ticket
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/railway_ticket?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=railway
spring.datasource.password=railway123

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# SQL 日志（dev 开启，打印明细 SQL）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.example.demo=debug
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

springdoc.swagger-ui.enabled=true

# 本地演示需要测试账号与模拟历史订单
app.demo-data.enabled=true
