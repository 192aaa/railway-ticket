# ==========================================
# 生产环境 (prod) - Docker Compose / Railway
# ==========================================
# 数据源统一使用 MySQL，通过环境变量注入：
#   SPRING_DATASOURCE_URL       JDBC 连接串
#   SPRING_DATASOURCE_USERNAME  用户名
#   SPRING_DATASOURCE_PASSWORD  密码
# docker-compose.yml 与 render.yaml 中的变量名保持一致
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 关闭 SQL 日志（生产环境不打印明细）
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.example.demo=info
logging.level.org.hibernate.SQL=warn
logging.level.root=warn

# 生产环境关闭 Swagger
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# 生产环境禁止创建弱口令测试账号与模拟订单；
# 站点/车次/余票等基础数据仍由 DataInitializer 幂等补齐。
app.demo-data.enabled=false

# 分域名部署：在 .env 中设置 APP_CORS_ALLOWED_ORIGINS=https://前端域名（多个用逗号分隔），
# 由主配置的 app.cors.allowed-origins 读取；同源部署保持默认 *。

# ---------- 缓存 ----------
# Compose / 生产默认使用 Redis 共享缓存；无 Redis 的部署（如 Render 免费方案）
# 用 SPRING_CACHE_TYPE=caffeine 回退到本地缓存。
spring.cache.type=${SPRING_CACHE_TYPE:redis}

# ---------- 数据库迁移 ----------
# prod 由 Flyway 建表并管理版本，Hibernate 不再改动 schema；
# baseline-on-migrate 兼容此前 ddl-auto=update 已建表的存量库。
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
