spring.application.name=railway-ticket

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/railway_ticket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET:railway_ticket_secret_key_2026_very_long_secret_for_jwt_signing}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.cache.type=caffeine
spring.cache.cache-names=tickets,stations,trains
spring.cache.caffeine.spec=expireAfterWrite=30s,maximumSize=500

management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}