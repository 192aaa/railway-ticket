# ==========================================
# 全局配置 - 默认使用开发环境
# ==========================================
# 启动方式:
#   开发环境: ./mvnw spring-boot:run
#   生产环境: ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
#   Railway:  设置环境变量 SPRING_PROFILES_ACTIVE=prod
# ==========================================

spring.application.name=railway-ticket

server.port=8080

# ---------- 数据源 ----------
# 统一使用 MySQL，具体连接信息由 dev / prod profile 提供
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# 方言由 Hibernate 依据 JDBC 连接自动识别，避免测试环境 H2 与 MySQL 方言冲突
spring.jpa.open-in-view=false

# ---------- Jackson ----------
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ssXXX
spring.jackson.time-zone=GMT+8

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:railway_ticket_secret_key_2026_very_long_secret_for_jwt_signing}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---------- 订单异步化（事务发件箱 + 可选 RabbitMQ） ----------
# 下单只创建 PENDING 订单并写事件，由 OrderEventWorker 异步扣票/选座/流转状态。
# mq.enabled=false 时靠 worker 定时轮询消费；true 时额外通过 RabbitMQ 即时唤醒。
app.order.mq.enabled=${ORDER_MQ_ENABLED:false}
app.order.worker.poll-ms=${ORDER_WORKER_POLL_MS:1000}
app.order.worker.recover-ms=${ORDER_WORKER_RECOVER_MS:30000}
app.order.worker.batch-size=${ORDER_WORKER_BATCH_SIZE:20}

# ---------- 限流（仅 Redis 缓存模式生效） ----------
# 每个 IP 在 window-seconds 窗口内允许的最大请求数
app.rate-limit.login-max=10
app.rate-limit.register-max=10
app.rate-limit.query-max=60
app.rate-limit.window-seconds=60

# ---------- 生产启动校验 ----------
# prod 强制要求 JWT_SECRET / 数据源口令由环境变量显式提供；
# Redis 缓存模式下还要求 SPRING_DATA_REDIS_PASSWORD。可用 APP_REQUIRE_STRONG_SECRETS=false 关闭。
app.security.require-strong-secrets=${APP_REQUIRE_STRONG_SECRETS:true}

# ---------- AI 助手（服务端代理，密钥不下发浏览器） ----------
# 未配置 ai.api-key 时，/api/ai/status 返回 configured=false，前端降级为模拟回复
ai.endpoint=${AI_ENDPOINT:https://api.deepseek.com/v1/chat/completions}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:deepseek-chat}
ai.temperature=${AI_TEMPERATURE:0.7}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# ---------- 演示数据 ----------
# app.data-init.enabled: 是否执行 DataInitializer（测试环境设为 false）
# app.demo-data.enabled: 是否创建弱口令测试账号与模拟历史订单（prod 必须为 false）
app.data-init.enabled=true
app.demo-data.enabled=true

# ---------- 跨域 ----------
# 默认 * 适用于同源反代与本地开发；前后端分域名部署时，
# 通过 APP_CORS_ALLOWED_ORIGINS 指定前端来源白名单（多个用逗号分隔，支持通配符）。
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# ---------- 缓存 ----------
# 默认沿用本地 Caffeine（dev 无需启动 Redis）；prod 默认 Redis，
# 均可通过环境变量 SPRING_CACHE_TYPE=redis|caffeine|none 覆盖。
spring.cache.type=${SPRING_CACHE_TYPE:caffeine}
spring.cache.cache-names=tickets,stations,trains
spring.cache.caffeine.spec=expireAfterWrite=30s,maximumSize=500
# Redis 缓存 TTL（秒），由 config/RedisConfig 读取
app.cache.redis.tickets-ttl-seconds=30
app.cache.redis.stations-ttl-seconds=600
app.cache.redis.trains-ttl-seconds=600

# ---------- Redis ----------
# 连接参数支持 SPRING_DATA_REDIS_HOST / PORT / PASSWORD / DATABASE 环境变量覆盖
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
# 未部署 Redis 的环境（dev / Render）不让 Redis 探测把 /actuator/health 拖成 DOWN；
# Compose 部署通过 REDIS_HEALTH_ENABLED=true 打开
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- 日志归档与链路追踪 ----------
# TraceIdFilter 为每个请求生成/透传 X-Trace-Id 并写入 MDC，日志格式见 logback-spring.xml
# prod 环境启用按天+大小滚动的文件归档，dev/test 仅输出到控制台
app.logging.dir=${LOG_DIR:logs}
app.logging.retain-days=${LOG_RETAIN_DAYS:30}
app.logging.max-size=${LOG_MAX_SIZE:100MB}
app.logging.total-size=${LOG_TOTAL_SIZE:3GB}

# ---------- 监控 ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ---------- 链路追踪（Micrometer + Brave，Span 导出到 Zipkin） ----------
# 显式启用追踪（Boot 4 默认关闭）
management.tracing.enabled=${TRACING_ENABLED:true}
# 采样率：演示环境 100%；生产可按比例降低（如 0.1）
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# Zipkin 上报地址；为空时不导出 Span（默认关闭，便于无 collector 的本地/Render 环境）
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:}
# 上报超时
management.zipkin.tracing.connect-timeout=${ZIPKIN_CONNECT_TIMEOUT:1s}
management.zipkin.tracing.read-timeout=${ZIPKIN_READ_TIMEOUT:1s}

# ---------- Profile 默认值 ----------
# 本地默认 dev，Railway 等平台请通过环境变量覆盖为 prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
