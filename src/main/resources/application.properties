spring.application.name=railway-ticket

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/railway_ticket?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0200}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=${JWT_SECRET:railway_ticket_secret_key_2026_very_long_secret_for_jwt_signing}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.cache.type=caffeine
spring.cache.cache-names=tickets,stations,trains
spring.cache.caffeine.spec=expireAfterWrite=30s,maximumSize=500

management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}