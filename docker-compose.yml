services:
  mysql:
    image: mysql:8.0
    container_name: railway-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PWD:-root123}
      MYSQL_DATABASE: railway_ticket
      MYSQL_USER: railway
      MYSQL_PASSWORD: ${DB_USER_PWD:-railway123}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 宿主机 3306 常被本机 MySQL 服务占用，改映射到 3307；容器内仍是 3306，
      # backend 通过服务名 mysql:3306 访问，不受影响。
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: railway-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/railway_ticket?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: railway
      SPRING_DATASOURCE_PASSWORD: ${DB_USER_PWD:-railway123}
      # 生产部署请在根目录 .env 中覆盖（模板见 .env.example）
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_random_long_string_2026}
      # 分域名部署时在 .env 中填前端来源白名单；同源反代保持默认 *
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: railway-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql-data:
