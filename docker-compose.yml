services:
  mysql:
    image: mysql:8.0
    container_name: railway-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PWD:-root123}
      MYSQL_DATABASE: railway_ticket
      MYSQL_USER: railway
      MYSQL_PASSWORD: ${DB_USER_PWD:-railway123}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 宿主机 3306 常被本机 MySQL 服务占用，改映射到 3307；容器内仍是 3306，
      # backend 通过服务名 mysql:3306 访问，不受影响。
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: railway-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-railway}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PWD:-railway_rabbit_123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # 管理台 http://localhost:15672
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: railway-redis
    restart: always
    environment:
      REDIS_PWD: ${REDIS_PWD:-railway_redis_123}
      # 供 healthcheck 的 redis-cli 读取，避免密码出现在命令行
      REDISCLI_AUTH: ${REDIS_PWD:-railway_redis_123}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PWD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    ports:
      # 宿主机已装 Redis 时可在 .env 中改 REDIS_HOST_PORT；容器内始终是 6379，
      # backend 通过服务名 redis:6379 访问，不受影响。
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: railway-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/railway_ticket?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: railway
      SPRING_DATASOURCE_PASSWORD: ${DB_USER_PWD:-railway123}
      # 生产部署请在根目录 .env 中覆盖（模板见 .env.example）
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_random_long_string_2026}
      # 分域名部署时在 .env 中填前端来源白名单；同源反代保持默认 *
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      # 缓存默认走 Redis；设 SPRING_CACHE_TYPE=caffeine 可回退本地缓存
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PWD:-railway_redis_123}
      REDIS_HEALTH_ENABLED: ${REDIS_HEALTH_ENABLED:-true}
      # 链路追踪：默认空（不上报）；启用 zipkin profile 时在 .env 设 ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # 订单异步化：通过 RabbitMQ 即时唤醒 worker（关掉则退化为定时轮询）
      ORDER_MQ_ENABLED: ${ORDER_MQ_ENABLED:-true}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-railway}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PWD:-railway_rabbit_123}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: railway-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 可选链路追踪 collector：docker compose --profile tracing up -d
  # 同时在根目录 .env 设置 ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
  zipkin:
    image: openzipkin/zipkin:3
    container_name: railway-zipkin
    profiles: ["tracing"]
    restart: always
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
